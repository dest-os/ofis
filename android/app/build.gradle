plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.destos.ares"
    compileSdk flutter.compileSdkVersion

    defaultConfig {
        applicationId "com.destos.ares"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            // V31'de gerçek mağaza imzası için GitHub Secrets/keystore bağlanacaktır.
            // Bu yapı ilk test build'inin alınabilmesi için imzasız release üretimine izin verir.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
