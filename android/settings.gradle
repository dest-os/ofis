pluginManagement {
    def flutterSdkPath = null
    def localProperties = new Properties()
    def localPropertiesFile = file("${rootDir}/../local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { localProperties.load(it) }
        flutterSdkPath = localProperties.getProperty("flutter.sdk")
    }
    if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
        flutterSdkPath = System.getenv("FLUTTER_ROOT")
    }
    if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
        throw new GradleException("Flutter SDK bulunamadı. FLUTTER_ROOT veya local.properties içindeki flutter.sdk tanımlanmalı.")
    }
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

rootProject.name = "dest_os_ares"
include ":app"
